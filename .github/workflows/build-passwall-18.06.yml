name: Build PassWall 4.55 (OpenWrt 18.06, mipsel_24kc)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 18.06.9
  OWRT_TARGET: ramips/mt7621

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-distutils rsync subversion swig \
            time unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OWRT_TARGET}"
          SDK_FILE="openwrt-sdk-18.06.9-ramips-mt7621_gcc-7.3.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading $SDK_FILE"
          wget -q "$BASE/$SDK_FILE" -O sdk.tar.xz
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk

      - name: Prepare feeds and sources
        working-directory: openwrt-sdk
        run: |
          cat > feeds.conf.default <<'EOF'
          src-git packages https://github.com/immortalwrt/packages;openwrt-18.06
          src-git luci https://github.com/immortalwrt/luci;openwrt-18.06-k5.4
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          printf '%s\n' \
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y" \
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y" \
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ChinaDNS_NG=y" \
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y" \
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Brook=y" >> .config
          # 18.06 SDK prerequisite check demands Python 2.x and rejects gcc 11+,
          # so touch the prereq stamp (same trick as the SSR Plus+ 18.06 build).
          mkdir -p staging_dir/host && touch staging_dir/host/.prereq-build && make defconfig FORCE=1

      - name: Compile luci-app-passwall
        working-directory: openwrt-sdk
        run: |
          if make package/luci-app-passwall/compile -j"$(nproc)" FORCE=1; then
            echo "BUILD OK"
          else
            echo "parallel build failed, retrying single-threaded for logs"
            make package/luci-app-passwall/compile -j1 V=s FORCE=1
          fi
          echo "---- built ipks ----"
          find bin/packages -name '*.ipk' | sort

      - name: Collect ipks
        if: always()
        run: |
          mkdir -p output
          find openwrt-sdk/bin/packages -name '*.ipk' -exec cp -v {} output/ \; || true
          ls -lh output/ || true

      - name: Pack ipks into one tarball
        if: hashFiles('output/*.ipk') != ''
        run: |
          tar -czf passwall-mipsel_24kc-openwrt-18.06.tar.gz -C output .
          ls -lh passwall-mipsel_24kc-openwrt-18.06.tar.gz

      - name: Upload artifacts
        if: always() && hashFiles('output/*.ipk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: passwall-mipsel_24kc-openwrt-18.06
          path: output/*.ipk

      - name: Publish release
        if: hashFiles('passwall-mipsel_24kc-openwrt-18.06.tar.gz') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: passwall-mipsel_24kc-openwrt-18.06
          name: PassWall 4.55 for OpenWrt 18.06 (mipsel_24kc)
          body: |
            luci-app-passwall 4.55 (from the ImmortalWrt 18.06 feeds) with
            Xray / Hysteria / Brook / Trojan-Plus / Shadowsocks-libev /
            ShadowsocksR-libev / ChinaDNS-NG cores, built with the official
            OpenWrt 18.06.9 SDK for mipsel_24kc (ramips/mt7621).
          files: passwall-mipsel_24kc-openwrt-18.06.tar.gz
          fail_on_unmatched_files: true
